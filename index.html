<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meera's Draft Bot</title>
  <style>
    :root { --bg: #faf8f5; --text: #1f1d1a; --muted: #6b665f; --accent: #2a7a5f; }
    @media (prefers-color-scheme: dark) { :root { --bg: #171614; --text: #f1eee9; --muted: #a39e96; --accent: #5fc39d; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 system-ui, -apple-system, sans-serif;
           min-height: 100vh; display: grid; place-items: center; padding: 0 16px; }
    main { max-width: 32rem; }
    h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
    p { color: var(--muted); margin: 0 0 1rem; }
    .dot { display: inline-block; width: .6rem; height: .6rem; border-radius: 50%; background: var(--accent); margin-right: .4rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Meera's draft bot</h1>
    <p><span class="dot"></span>Running</p>
    <p>Send a note to <a href="https://t.me/MeeraSkin_content_bot">@MeeraSkin_content_bot</a> on Telegram and it replies with a draft post in Meera's voice.</p>
  </main>
</body>
</html>
